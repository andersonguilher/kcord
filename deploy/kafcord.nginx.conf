server {
    listen <SERVER_PUBLIC_IP>:80;
    server_name kafcord.kafly.com.br;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen <SERVER_PUBLIC_IP>:443 ssl;
    server_name kafcord.kafly.com.br;

    ssl_certificate /etc/letsencrypt/live/kafcord.kafly.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kafcord.kafly.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Multipart framing adds a small overhead; the application still enforces a
    # strict 10 MiB file limit.
    client_max_body_size 11m;

    location / {
        # KCord clients never compress request bodies. Reject them before Node to
        # avoid unnecessary decompression and its associated DoS surface.
        if ($http_content_encoding != "") { return 415; }

        proxy_pass http://127.0.0.1:3201;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}
