    # LiveKit (SFU) signalling. Only the paths browsers need are exposed; the admin API
    # stays on localhost and is used by the KCord server alone (docs/LIVEKIT.md).
    location ~ ^/livekit/(rtc(?:/v1)?(?:/validate)?)$ {
        rewrite ^/livekit/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /livekit/ {
        return 404;
    }

