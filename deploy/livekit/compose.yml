services:
  livekit:
    image: livekit/livekit-server:v1.13.11
    container_name: livekit
    restart: unless-stopped
    # Host networking avoids Docker NAT rules, which have been lost after daemon restarts.
    network_mode: host
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
