name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Isolated integration tests
        run: |
          npm run test:chat-store
          npm run test:link-preview
          npm run test:client-reports
          npm run test:voice-permissions
          npm run test:session-afk
          npm run test:voice-eq
          npm run test:state-migration
      - name: Real-time smoke test
        env:
          KAFCORD_CHAT_DATABASE_PATH: ${{ runner.temp }}/ci-chat.sqlite
        run: |
          npm start > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3001/api/health >/dev/null && break
            sleep 1
          done
          npm run test:smoke || { cat "$RUNNER_TEMP/server.log"; exit 1; }

  ui:
    # Real browser, real built client, two fake logged-in users (chat, voice, settings, owner panel).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:ui
