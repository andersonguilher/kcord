[package]
name = "kcord-app-audio"
version = "0.1.0"
edition = "2021"
publish = false
description = "Captures the audio of one Windows process tree for KCord screen shares"

[[bin]]
name = "kcord-app-audio"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
windows-core = "0.62.2"
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Media",
  "Win32_Media_Audio",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Threading",
  "Win32_System_Variant",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
